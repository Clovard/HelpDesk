<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
          name="viewport"
          content="width=device-width, initial-scale=1"
  >
  <title>IT Helpdesk</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">☁</div>

      <div>
        <b>IT Helpdesk</b>
        <small>Поддержка сотрудников</small>
      </div>
    </div>

    <nav>
      <button
              id="ticketsButton"
              class="menu active"
              type="button"
      >
        <span>▣</span>
        <span>Заявки</span>
        <em>0</em>
      </button>

      <button
              id="ideasButton"
              class="menu"
              type="button"
      >
        <span>♧</span>
        <span>Идеи</span>
        <em>0</em>
      </button>

      <button class="menu mock" type="button">
        <span>▥</span>
        <span>Статистика</span>
      </button>

      <button class="menu mock" type="button">
        <span>▤</span>
        <span>База знаний</span>
      </button>

      <button class="menu mock" type="button">
        <span>♧</span>
        <span>Пользователи</span>
      </button>

      <button class="menu mock" type="button">
        <span>◷</span>
        <span>Отчёты</span>
      </button>

      <button class="menu mock" type="button">
        <span>⚙</span>
        <span>Настройки</span>
      </button>
    </nav>

    <div class="user">
      <div class="avatar">AA</div>

      <div>
        <b>Андрей</b>
        <small>Администратор</small>
      </div>
    </div>
  </aside>

  <main class="content">
    <header class="header">
      <div class="header-user">
        <div class="avatar">AA</div>

        <div>
          <b>Андрей</b>
          <small>Администратор</small>
        </div>
      </div>
    </header>

    <section class="page">
      <div class="heading">
        <div>
          <h1>Обзор заявок</h1>
          <p>
            Управление обращениями IT-поддержки
          </p>
        </div>

        <div class="online">
          <i></i>
          Синхронизация включена
        </div>
      </div>

      <div class="stats">
        <div class="stat blue">
          <strong id="newCount">0</strong>
          <b>Новые</b>
          <small>Требуют внимания</small>
        </div>

        <div class="stat orange">
          <strong id="reviewCount">0</strong>
          <b>На рассмотрении</b>
          <small>Ожидают проверки</small>
        </div>

        <div class="stat purple">
          <strong id="workCount">0</strong>
          <b>В работе</b>
          <small>Решаем сейчас</small>
        </div>

        <div class="stat green">
          <strong id="closedCount">0</strong>
          <b>Закрытые</b>
          <small>Всего завершено</small>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">
          <span>⌕</span>

          <input
                  id="search"
                  type="search"
                  placeholder="Поиск по заявкам..."
          >
        </div>

        <button
                id="refreshButton"
                class="refresh"
                type="button"
        >
          ↻
        </button>

        <button
                id="kanbanButton"
                class="view active"
                type="button"
        >
          ▦ Канбан
        </button>

        <button
                id="listButton"
                class="view"
                type="button"
        >
          ☷ Список
        </button>
      </div>

      <main
              id="board"
              class="board"
      ></main>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
